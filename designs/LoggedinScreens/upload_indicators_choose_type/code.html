<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased">
<header class="flex justify-between items-center py-sm px-container-margin border-b border-outline-variant bg-surface sticky top-0 z-50">
<div class="flex items-center gap-sm">
<span class="font-h3 text-h3 text-primary tracking-tight">SRHR Portal</span>
<span class="h-6 w-px bg-outline-variant"></span>
<span class="font-body-sm text-body-sm text-on-surface-variant">Indicator Upload</span>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container hover:text-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<main class="flex-grow flex flex-col items-center px-container-margin py-xl w-full max-w-5xl mx-auto">
<div class="w-full max-w-2xl mb-xl">
<div class="flex items-center justify-between relative px-xl">
<div class="flex flex-col items-center relative z-10">
<div class="w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-md text-label-md shadow-sm">
<span class="material-symbols-outlined" style="font-size: 16px;">check</span>
</div>
<span class="font-label-md text-label-md text-primary mt-sm absolute top-10 whitespace-nowrap">Dataset</span>
</div>
<div class="flex-grow h-0.5 bg-primary absolute left-xl right-1/2 top-4 -z-0"></div>
<div class="flex-grow h-0.5 bg-surface-variant absolute left-1/2 right-xl top-4 -z-0"></div>
<div class="flex flex-col items-center relative z-10">
<div class="w-8 h-8 rounded-full border-2 border-primary bg-surface text-primary flex items-center justify-center font-label-md text-label-md shadow-sm ring-4 ring-primary/5">
                        2
                    </div>
<span class="font-label-md text-label-md text-primary mt-sm absolute top-10 whitespace-nowrap">Upload Type</span>
</div>
<div class="flex flex-col items-center relative z-10">
<div class="w-8 h-8 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center font-label-md text-label-md">
                        3
                    </div>
<span class="font-label-md text-label-md text-on-surface-variant mt-sm absolute top-10 whitespace-nowrap">Mapping</span>
</div>
<div class="flex flex-col items-center relative z-10">

                        4
                    </div>
<span class="font-label-md text-label-md text-on-surface-variant mt-sm absolute top-10 whitespace-nowrap">Review</span>
</div>
</div>
</div>
<div class="text-center mb-xl w-full mt-lg">
<h1 class="font-h1 text-h1 text-primary mb-sm">Choose Upload Type</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">Select the most efficient method to input your indicator data for the current reporting cycle.</p>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md w-full max-w-4xl mb-xl">
<label class="group relative cursor-pointer block">
<input class="peer sr-only" name="upload_type" type="radio" value="manual"/>
<div class="h-full border border-outline-variant rounded-xl p-lg bg-surface-container-lowest transition-all duration-300 peer-checked:border-secondary peer-checked:border-2 peer-checked:bg-secondary-container/5 peer-checked:shadow-sm hover:border-primary hover:-translate-y-1 hover:shadow-sm flex flex-col items-start text-left">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-primary mb-md group-hover:bg-primary-fixed group-hover:text-on-primary-fixed transition-colors peer-checked:bg-secondary-container peer-checked:text-on-secondary-container">
<span class="material-symbols-outlined">keyboard</span>
</div>
<h3 class="font-h3 text-h3 text-primary mb-xs">Manual Entry</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Enter indicator values directly into a web-based form. Best for small datasets or making quick ad-hoc updates.</p>
<div class="absolute top-md right-md text-secondary opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
<label class="group relative cursor-pointer block">
<input checked="" class="peer sr-only" name="upload_type" type="radio" value="excel"/>
<div class="h-full border border-outline-variant rounded-xl p-lg bg-surface-container-lowest transition-all duration-300 peer-checked:border-secondary peer-checked:border-2 peer-checked:bg-secondary-container/5 peer-checked:shadow-sm hover:border-primary hover:-translate-y-1 hover:shadow-sm flex flex-col items-start text-left">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-primary mb-md group-hover:bg-primary-fixed group-hover:text-on-primary-fixed transition-colors peer-checked:bg-secondary-container peer-checked:text-on-secondary-container">
<span class="material-symbols-outlined">upload_file</span>
</div>
<h3 class="font-h3 text-h3 text-primary mb-xs">Excel Upload</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Download our standardized template, fill it out offline, and upload it in bulk. Ideal for comprehensive quarterly reporting.</p>
<div class="absolute top-md right-md text-secondary opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
<label class="group relative cursor-pointer block">
<input class="peer sr-only" name="upload_type" type="radio" value="import"/>
<div class="h-full border border-outline-variant rounded-xl p-lg bg-surface-container-lowest transition-all duration-300 peer-checked:border-secondary peer-checked:border-2 peer-checked:bg-secondary-container/5 peer-checked:shadow-sm hover:border-primary hover:-translate-y-1 hover:shadow-sm flex flex-col items-start text-left">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-primary mb-md group-hover:bg-primary-fixed group-hover:text-on-primary-fixed transition-colors peer-checked:bg-secondary-container peer-checked:text-on-secondary-container">
<span class="material-symbols-outlined">history</span>
</div>
<h3 class="font-h3 text-h3 text-primary mb-xs">Import from Previous Period</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Clone the indicator structure and values from your last submission as a starting point. Saves time for consistent data.</p>
<div class="absolute top-md right-md text-secondary opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
<label class="group relative cursor-pointer block">
<input class="peer sr-only" name="upload_type" type="radio" value="mobile"/>
<div class="h-full border border-outline-variant rounded-xl p-lg bg-surface-container-lowest transition-all duration-300 peer-checked:border-secondary peer-checked:border-2 peer-checked:bg-secondary-container/5 peer-checked:shadow-sm hover:border-primary hover:-translate-y-1 hover:shadow-sm flex flex-col items-start text-left">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-primary mb-md group-hover:bg-primary-fixed group-hover:text-on-primary-fixed transition-colors peer-checked:bg-secondary-container peer-checked:text-on-secondary-container">
<span class="material-symbols-outlined">sync</span>
</div>
<h3 class="font-h3 text-h3 text-primary mb-xs">Sync from Mobile</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Pull data directly collected by field agents using the mobile companion app. Requires established mobile workspaces.</p>
<div class="absolute top-md right-md text-secondary opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
</div>

                Back
            </button>
<button class="px-xl py-sm rounded-full bg-primary text-on-primary font-label-lg text-label-lg hover:opacity-90 transition-opacity flex items-center gap-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface">
                Next Step
                <span class="material-symbols-outlined" style="font-size: 18px;">arrow_forward</span>
</button>
